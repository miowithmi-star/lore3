<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#66A5ED"
  >

  <title>Welcome</title>

  <link
    rel="stylesheet"
    href="css/lock.css"
  >

  <link
    rel="stylesheet"
    href="css/main.css"
  >
</head>


<body class="locked">

  <!-- =====================================================
       SVG SPRITE
       ===================================================== -->

  <svg
    aria-hidden="true"
    style="
      position: absolute;
      width: 0;
      height: 0;
      overflow: hidden;
    "
  >

    <symbol
      id="flower-soft"
      viewBox="0 0 100 100"
    >
      <g fill="currentColor">

        <ellipse
          cx="50"
          cy="25"
          rx="16"
          ry="26"
        />

        <ellipse
          cx="50"
          cy="25"
          rx="16"
          ry="26"
          transform="rotate(72 50 50)"
        />

        <ellipse
          cx="50"
          cy="25"
          rx="16"
          ry="26"
          transform="rotate(144 50 50)"
        />

        <ellipse
          cx="50"
          cy="25"
          rx="16"
          ry="26"
          transform="rotate(216 50 50)"
        />

        <ellipse
          cx="50"
          cy="25"
          rx="16"
          ry="26"
          transform="rotate(288 50 50)"
        />

      </g>

      <circle
        cx="50"
        cy="50"
        r="12"
        fill="#F6C45C"
      />
    </symbol>


    <symbol
      id="flower-daisy"
      viewBox="0 0 100 100"
    >

      <g fill="currentColor">

        <ellipse cx="50" cy="20" rx="10" ry="22"/>

        <ellipse
          cx="50"
          cy="20"
          rx="10"
          ry="22"
          transform="rotate(45 50 50)"
        />

        <ellipse
          cx="50"
          cy="20"
          rx="10"
          ry="22"
          transform="rotate(90 50 50)"
        />

        <ellipse
          cx="50"
          cy="20"
          rx="10"
          ry="22"
          transform="rotate(135 50 50)"
        />

        <ellipse
          cx="50"
          cy="20"
          rx="10"
          ry="22"
          transform="rotate(180 50 50)"
        />

        <ellipse
          cx="50"
          cy="20"
          rx="10"
          ry="22"
          transform="rotate(225 50 50)"
        />

        <ellipse
          cx="50"
          cy="20"
          rx="10"
          ry="22"
          transform="rotate(270 50 50)"
        />

        <ellipse
          cx="50"
          cy="20"
          rx="10"
          ry="22"
          transform="rotate(315 50 50)"
        />

      </g>

      <circle
        cx="50"
        cy="50"
        r="12"
        fill="#F6C45C"
      />

    </symbol>


    <symbol
      id="flower-four"
      viewBox="0 0 100 100"
    >

      <g fill="currentColor">

        <ellipse cx="50" cy="27" rx="18" ry="27"/>
        <ellipse cx="73" cy="50" rx="27" ry="18"/>
        <ellipse cx="50" cy="73" rx="18" ry="27"/>
        <ellipse cx="27" cy="50" rx="27" ry="18"/>

      </g>

      <circle
        cx="50"
        cy="50"
        r="11"
        fill="#FFF9EA"
      />

    </symbol>


    <symbol
      id="flower-bloom"
      viewBox="0 0 100 100"
    >

      <g fill="currentColor">

        <circle cx="50" cy="28" r="21"/>
        <circle cx="70" cy="42" r="21"/>
        <circle cx="63" cy="66" r="21"/>
        <circle cx="37" cy="66" r="21"/>
        <circle cx="30" cy="42" r="21"/>

      </g>

      <circle
        cx="50"
        cy="50"
        r="14"
        fill="#F6C45C"
      />

    </symbol>

  </svg>


  <!-- =====================================================
       СЛОЙ 1

       Сюда JS загрузит pages/main.html
       ===================================================== -->

  <main
    id="app"
    class="site-layer"
  ></main>


  <!-- =====================================================
       СЛОЙ 2
       LOCK SCREEN
       ===================================================== -->

  <section
    class="lock-screen"
    id="lockScreen"
  >

    <div class="decor decor-1">
      <svg class="flower-icon">
        <use href="#flower-soft"></use>
      </svg>
    </div>

    <div class="decor decor-2">
      <svg class="flower-icon">
        <use href="#flower-daisy"></use>
      </svg>
    </div>

    <div class="decor decor-3">
      <svg class="flower-icon">
        <use href="#flower-four"></use>
      </svg>
    </div>

    <div class="decor decor-4">
      <svg class="flower-icon">
        <use href="#flower-bloom"></use>
      </svg>
    </div>

    <div class="decor decor-5">
      <svg class="flower-icon">
        <use href="#flower-soft"></use>
      </svg>
    </div>

    <div class="decor decor-6">
      <svg class="flower-icon">
        <use href="#flower-bloom"></use>
      </svg>
    </div>


    <div class="lock-panel">

      <h1
        class="lock-title"
        aria-label="Welcome"
      >

        <span class="letter l1">W</span>
        <span class="letter l2">e</span>
        <span class="letter l3">l</span>
        <span class="letter l4">c</span>
        <span class="letter l5">o</span>
        <span class="letter l6">m</span>
        <span class="letter l7">e</span>

      </h1>


      <p class="lock-subtitle">
        enter your pin
      </p>


      <div
        class="pin-dots"
        id="pinDots"
      >

        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>

      </div>


      <div class="pin-pad">

        <button class="pin-btn" data-value="1">1</button>
        <button class="pin-btn" data-value="2">2</button>
        <button class="pin-btn" data-value="3">3</button>

        <button class="pin-btn" data-value="4">4</button>
        <button class="pin-btn" data-value="5">5</button>
        <button class="pin-btn" data-value="6">6</button>

        <button class="pin-btn" data-value="7">7</button>
        <button class="pin-btn" data-value="8">8</button>
        <button class="pin-btn" data-value="9">9</button>

        <button class="pin-btn" data-value="0">0</button>

      </div>

    </div>

  </section>


  <!-- =====================================================
       СЛОЙ 3
       TRANSITION
       ===================================================== -->

  <div
    class="floral-transition"
    id="floralTransition"
  >

    <svg class="transition-flower tf1">
      <use href="#flower-bloom"></use>
    </svg>

    <svg class="transition-flower tf2">
      <use href="#flower-daisy"></use>
    </svg>

    <svg class="transition-flower tf3">
      <use href="#flower-soft"></use>
    </svg>

    <svg class="transition-flower tf4">
      <use href="#flower-bloom"></use>
    </svg>

    <svg class="transition-flower tf5">
      <use href="#flower-four"></use>
    </svg>

    <svg class="transition-flower tf6">
      <use href="#flower-soft"></use>
    </svg>

    <svg class="transition-flower tf7">
      <use href="#flower-daisy"></use>
    </svg>

    <svg class="transition-flower tf8">
      <use href="#flower-four"></use>
    </svg>

  </div>


  <script
    type="module"
    src="js/lock.js"
  ></script>

</body>
</html>
